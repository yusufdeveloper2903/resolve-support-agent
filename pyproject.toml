[project]
name = "resolve"
version = "0.1.0"
description = "AI customer-support agent with tools, human-in-the-loop approvals, guardrails, evals and an MCP server."
readme = "README.md"
license = "MIT"
authors = [{ name = "Yusuf Yuldashev" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3,<3",
    "fastapi>=0.162",
    "mcp>=2.3,<3",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pre-commit>=4",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "types-PyYAML",
]

[project.scripts]
resolve-api = "resolve.api:main"
resolve-mcp = "resolve.mcp_server:main"
resolve-seed = "resolve.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolve"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "C4"]
ignore = ["S101", "S608"]  # asserts in tests; SQL is built from constants only

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "evals"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
